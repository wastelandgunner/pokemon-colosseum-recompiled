[package]
name = "colo-viewer"
description = "Bevy room viewer for Pokemon Colosseum: map, NPCs, collision, talk scripts"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
colo-formats = { path = "../colo-formats" }
colo-script = { path = "../colo-script" }
colo-audio = { path = "../colo-audio" }
colo-recomp = { path = "../colo-recomp" }
colo-gx = { path = "../colo-gx" }
colo-gxgpu = { path = "../colo-gxgpu" }
wgpu = { version = "29", default-features = false, features = ["vulkan", "metal", "dx12", "wgsl"] }
winit = "0.30"
gilrs = "0.11"
futures-lite = "2"
cpal = "0.15"
# Bevy's "3d" + "ui" spelled out, with the C zstd backend (zstd_c) in place of ruzstd (zstd_rust,
# RUSTSEC-2026-0344): zstd only decodes Bevy's own built-in KTX2 tonemapping/SMAA lookup tables.
bevy = { version = "0.19", default-features = false, features = [
    "default_app", "default_platform", "scene", "picking",
    "common_api", "bevy_light", "bevy_mikktspace", "ktx2", "morph_animation", "morph", "smaa_luts", "tonemapping_luts", "zstd_c",
    "bevy_render", "bevy_core_pipeline", "bevy_gizmos_render", "bevy_anti_alias", "bevy_gltf", "bevy_pbr", "bevy_post_process", "gltf_animation",
    "bevy_input_focus", "bevy_ui", "bevy_ui_render", "bevy_ui_widgets",
] }
ab_glyph = "0.2"
# the UI text: autohinted outlines (the font has no hints of its own), rasterized by ab_glyph's rasterizer
skrifa = "0.44"
ab_glyph_rasterizer = "0.1"
rfd = "0.17"
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
# storybattle HOSTPROF: SIGPROF sampler of the host program counter
libc = "0.2"
